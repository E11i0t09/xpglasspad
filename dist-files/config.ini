# XPGlassPad settings – restart X-Plane (or reload plugins) after changing

# Port the iPad/tablet connects to:  http://<PC-IP>:8090
port = 8090

# Max frames per second per display (only while a tablet is watching)
fps = 20

# JPEG quality 30..95 (higher = sharper, more Wi-Fi traffic)
jpeg_quality = 80

# pbo  = asynchronous readback (easier on sim FPS, ~1 frame extra latency)
# sync = direct readback (slightly lower latency, may cost FPS)
readback = pbo

# Seconds without a tablet request before capturing pauses
watch_timeout = 3
